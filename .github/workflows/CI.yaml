name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run CommonMark Tests
        run: ctest --test-dir build --output-on-failure

      - name: Make bench script executable
        run: chmod +x run_bench.sh

      - name: Run Benchmark
        run: ./run_bench.sh --rounds 2 --benchmark_min_time=0.5

      - name: Verify CLI Tool
        run: |
          # This ensures the build artifact is actually functional
          echo "# Hello World" | build/main
